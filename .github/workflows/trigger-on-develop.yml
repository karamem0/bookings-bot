name: Trigger on develop

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build source
    uses: ./.github/workflows/build-source.yml
    secrets: inherit
    with:
      environment: dev
  deploy:
    name: Deploy to Azure
    needs: build
    uses: ./.github/workflows/deploy-to-azure.yml
    secrets: inherit
    with:
      environment: dev
      slot-name: dev
